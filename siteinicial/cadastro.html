<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro - MJRewind</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topbar">
    <a href="index.html" class="logo">MJRewind</a>
    <nav class="menu">
      <a href="cadastro.html">Cadastro</a>
      <a href="login.html">Login</a>
      <a href="#discografia">Discografia</a>
      <a href="#estatisticas">Estatísticas</a>
    </nav>
  </header>

  <main class="conteudo">
    <div class="form-card">
      <h1>Criar conta</h1>

      <label for="inp_nome">Nome</label>
      <input type="text" id="inp_nome" placeholder="Informe seu nome"> <br> 

      <label for="inp_email">Email</label>
      <input type="text" id="inp_email" placeholder="Insira seu email"> <br>

      <label for="inp_senha">Senha</label>
      <input type="password" id="inp_senha" placeholder="Insira sua senha"> <br>

      <label for="inp_confirmar">Confirmar senha</label>
      <input type="password" id="inp_confirmar" placeholder="Insira sua senha novamente"> <br>

      <p id="mensagem_erro" class="mensagem"></p>

      <button onclick="cadastrar()" class="botao">Cadastrar</button>

      <p class="troca">Já possui uma conta? <a href="login.html">Entrar</a></p>
    </div>
  </main>

  <script>
    function mostrarMensagem(texto, sucesso) {
      const msg = document.getElementById("mensagem_erro");
      msg.innerHTML = texto;
      msg.className = sucesso ? "mensagem sucesso" : "mensagem";
    }

    function cadastrar() {
      let nome = inp_nome.value;
      let email = inp_email.value;
      let senha = inp_senha.value;
      let confirmarSenha = inp_confirmar.value;

      // Validação dos campos
      if (nome == "" || email == "" || senha == "" || confirmarSenha == "") {
        mostrarMensagem("Preencha todos os campos!", false);
        return false;
      }
      else if (!email.includes("@")) {
        mostrarMensagem('E-mail inválido! Deve conter "@".', false);
        return false;
      }
      else if (senha != confirmarSenha) {
        mostrarMensagem("As senhas não coincidem!", false);
        return false;
      }
      else {
        // Conexão futura com a API / banco de dados
        fetch("/usuarios/cadastrar", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            nomeServer: nome,
            emailServer: email,
            senhaServer: senha
          })
        })
          .then(function (resposta) {
            console.log("resposta: ", resposta);

            if (resposta.ok) {
              mostrarMensagem("Cadastro realizado com sucesso! Redirecionando para o login...", true);

              setTimeout(() => {
                window.location = "login.html";
              }, 2000);
            } else {
              throw "Houve um erro ao tentar realizar o cadastro!";
            }
          })
          .catch(function (erro) {
            console.log(`#ERRO: ${erro}`);
            mostrarMensagem("Não foi possível realizar o cadastro.", false);
          });

        return false;
      }
    }
  </script>

</body>
</html>
