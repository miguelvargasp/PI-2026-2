<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avaliar HIStory - MJRewind</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topbar">
    <a href="index.html" class="logo" id="link_logo">MJRewind</a>
    <nav class="menu">
      <a href="cadastro.html" id="menu_cadastro">Cadastro</a>
      <a href="login.html" id="menu_login">Login</a>
      <a href="discografia.html">Discografia</a>
      <a href="dashboard.html">Estatísticas</a>
    </nav>
  </header>

  <main class="conteudo">
    <div class="form-card avaliacao-card">

      <div class="avaliacao-capa">
        <img src="https://upload.wikimedia.org/wikipedia/en/3/35/MJ-HIStory.jpg?utm_source=en.wikipedia.org&amp;utm_campaign=index&amp;utm_content=original" alt="Capa do álbum HIStory">
      </div>

      <div class="avaliacao-form">
        <h1>HIStory</h1>

        <label for="inp_nota">Nota (de 0 a 10)</label>
        <input type="number" id="inp_nota" placeholder="Ex: 10">

        <label for="inp_musica">Música favorita</label>
        <input type="text" id="inp_musica" class="maiuscula" placeholder="Qual é a sua favorita?" oninput="converterMaiuscula(this)">

        <label for="inp_comentario">Comentário</label>
        <textarea id="inp_comentario" rows="3" placeholder="Escreva um comentário sobre o álbum"></textarea>

        <p id="mensagem_erro" class="mensagem"></p>

        <button onclick="avaliar()" class="botao">Avaliar</button>
      </div>

    </div>
  </main>

  <footer class="rodape">
    <div class="rodape-logo">MJRewind</div>
    <p class="direitos">© The Michael Jackson Company, LLC. Todos os direitos reservados.</p>
  </footer>

  <script>
    const ALBUM = "HIStory";

    if (sessionStorage.getItem("ID_USUARIO")) {
      document.getElementById("menu_cadastro").style.display = "none";
      document.getElementById("menu_login").style.display = "none";
      document.getElementById("link_logo").href = "indexLog.html";
    }

    function mostrarMensagem(texto, sucesso) {
      const msg = document.getElementById("mensagem_erro");
      msg.innerHTML = texto;
      msg.className = sucesso ? "mensagem sucesso" : "mensagem";
    }

    function converterMaiuscula(campo) {
      const inicio = campo.selectionStart;
      const fim = campo.selectionEnd;
      campo.value = campo.value.toUpperCase();
      campo.setSelectionRange(inicio, fim);
    }

    function avaliar() {
      let notaVar = inp_nota.value;
      let musicaVar = inp_musica.value.trim();
      let comentarioBruto = inp_comentario.value;
      let comentarioVar = comentarioBruto.trim();

      if (notaVar == "" || musicaVar == "" || comentarioVar == "") {
        mostrarMensagem("Preencha todos os campos!", false);
        return false;
      }
      else if (isNaN(Number(notaVar)) || !(Number(notaVar) >= 0 && Number(notaVar) <= 10)) {
        mostrarMensagem("A nota deve ser um número de 0 a 10!", false);
        return false;
      }
      else if (comentarioBruto.length > 100) {
        mostrarMensagem("O comentário deve ter no máximo 100 caracteres!", false);
        return false;
      }
      else {
        fetch("/avaliacoes/cadastrar", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            idUsuarioServer: sessionStorage.ID_USUARIO,
            albumServer: ALBUM,
            notaServer: Number(notaVar),
            musicaServer: musicaVar,
            comentarioServer: comentarioVar
          })
        }).then(function (resposta) {
          if (resposta.ok) {
            mostrarMensagem("Avaliação enviada com sucesso!", true);
            inp_nota.value = "";
            inp_musica.value = "";
            inp_comentario.value = "";
          } else {
            throw "Houve um erro ao tentar enviar a avaliação!";
          }
        }).catch(function (erro) {
          console.log(`#ERRO: ${erro}`);
          mostrarMensagem("Não foi possível enviar a avaliação.", false);
        });

        return false;
      }
    }
  </script>

</body>
</html>
